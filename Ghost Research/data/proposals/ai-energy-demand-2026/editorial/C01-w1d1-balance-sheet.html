<!doctype html>
<html><head><meta charset="utf-8"/>
<link href="https://fonts.googleapis.com/css2?family=Oranienbaum&family=Manrope:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
 *{box-sizing:border-box;margin:0;padding:0}
  .gh-logo{display:inline-flex;flex-direction:column;gap:2px;align-items:flex-start;line-height:1;font-family:'Oranienbaum',serif;color:#FFFFFF;text-decoration:none}
  .gh-logo .r1{display:flex;align-items:center;font-size:42px;letter-spacing:-.01em;font-weight:400}
  .gh-logo .sq{position:relative;width:34px;height:34px;background:#EF4444;border-radius:7px;display:inline-block;margin:0 3px;flex-shrink:0;align-self:center;transform:translateY(2px)}
  .gh-logo .sq::after{content:"";position:absolute;inset:11px;background:#FFFFFF;border-radius:2px}
  .gh-logo .r2{font-size:18px;letter-spacing:.42em;font-weight:400;color:#FFFFFF;margin-left:1px;margin-top:3px}
  .gh-logo.dark .r1, .gh-logo.dark .r2{color:#000000}
  body{background:#06062D;font-family:'Manrope',sans-serif;color:#FFFFFF;
    width:100%;height:100vh;display:grid;grid-template-columns:55% 45%;overflow:hidden}
  .left{position:relative;background:
    linear-gradient(180deg, rgba(6,6,45,0.12) 0%, rgba(6,6,45,0.7) 100%),
    url("file:///C:/Users/Shreyanshi%20Rathi/Desktop/Ghost%20research/Ghost%20Research/data/proposals/ai-energy-demand-2026/assets/P01-utility-cfo-capex.jpg") center/cover no-repeat;
    height:100vh;padding:6.5%}
  .right{background:#EF4444;padding:6.5%;display:flex;flex-direction:column;color:#FFFFFF;position:relative}
  .eyebrow{font-size:18px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:#FFFFFF;margin-bottom:18px;opacity:.95}
  .stat{font-family:'Oranienbaum',serif;font-size:clamp(120px,17vh,200px);line-height:.86;letter-spacing:-.045em;color:#FFFFFF;margin:0 0 0 -4px}
  .rule{height:3px;width:80px;background:#FFFFFF;margin:22px 0 20px;opacity:.85}
  .h1{font-family:'Oranienbaum',serif;font-size:clamp(36px,5.2vh,54px);line-height:1.04;letter-spacing:-.01em;color:#FFFFFF;max-width:14ch;font-weight:400}
  .h1 strong{font-weight:400;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:6px}
  .cta{display:inline-flex;align-items:center;gap:14px;background:#06062D;color:#FFFFFF;padding:22px 34px;border-radius:3px;font-weight:800;font-size:23px;letter-spacing:.02em;align-self:flex-start;margin-top:auto}
  .cta:after{content:"→"}
  .footer-cred{font-size:17px;font-weight:600;letter-spacing:.06em;color:#FFFFFF;opacity:.92;margin-top:20px;line-height:1.4}
</style></head>
<body>
  <div class="left"><div class="gh-logo"><div class="r1">GH<span class="sq"></span>ST</div><div class="r2">RESEARCH</div></div></div>
  <div class="right">
    <div class="eyebrow">Drops · June 1, 2026</div>
    <div class="stat">$147B</div>
    <div class="rule"></div>
    <div class="h1">just landed on <strong>9 utility</strong> balance sheets.</div>
    <a class="cta">Get on the drop list</a>
    <div class="footer-cred">Caspr-powered · Expert-vetted · FERC-traceable</div>
  </div>
</body></html>
