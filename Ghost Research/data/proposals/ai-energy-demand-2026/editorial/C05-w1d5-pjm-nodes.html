<!doctype html>
<html><head><meta charset="utf-8"/>
<link href="https://fonts.googleapis.com/css2?family=Oranienbaum&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
 *{box-sizing:border-box;margin:0;padding:0}
  .gh-logo{display:inline-flex;flex-direction:column;gap:2px;align-items:flex-start;line-height:1;font-family:'Oranienbaum',serif;color:#FFFFFF;text-decoration:none}
  .gh-logo .r1{display:flex;align-items:center;font-size:42px;letter-spacing:-.01em;font-weight:400}
  .gh-logo .sq{position:relative;width:34px;height:34px;background:#EF4444;border-radius:7px;display:inline-block;margin:0 3px;flex-shrink:0;align-self:center;transform:translateY(2px)}
  .gh-logo .sq::after{content:"";position:absolute;inset:11px;background:#FFFFFF;border-radius:2px}
  .gh-logo .r2{font-size:18px;letter-spacing:.42em;font-weight:400;color:#FFFFFF;margin-left:1px;margin-top:3px}
  .gh-logo.dark .r1, .gh-logo.dark .r2{color:#000000}
 body{
 background:
 linear-gradient(140deg, rgba(6,6,45,0.55) 0%, rgba(6,6,45,0.92) 100%),
 url("file:///C:/Users/Shreyanshi%20Rathi/Desktop/Ghost%20research/Ghost%20Research/data/proposals/ai-energy-demand-2026/assets/P04-trader-pjm-heatmap.jpg") center/cover no-repeat;
 color:#F8F8FF;font-family:'Manrope',sans-serif;
 width:100%;height:100vh;padding:6.5%;
 display:flex;flex-direction:column;justify-content:space-between
 }
  .eyebrow{font-size:20px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:#EF4444;margin-bottom:14px}
 .h1{font-family:'Oranienbaum',serif;font-size:clamp(54px,7.4vh,76px);line-height:1.08;letter-spacing:-.01em;max-width:24ch;text-shadow:0 4px 18px rgba(0,0,0,.5)}
 .h1 em{font-style:italic;color:#EF4444}
 .sub{font-size:22px;line-height:1.5;color:rgba(255,255,255,.85);max-width:38ch;margin-top:22px}
 .rule{height:2px;width:64px;background:#EF4444;margin:22px 0}
 .cta{display:inline-flex;background:#EF4444;color:#fff;padding:18px 32px;border-radius:4px;font-weight:800;font-size:22px;letter-spacing:.02em;gap:12px}
 .cta:after{content:"→"}
 .bottom{display:flex;align-items:flex-end;justify-content:space-between}
 .src{font-size:14px;color:rgba(255,255,255,.6);max-width:30ch;text-align:right;line-height:1.5}
</style></head>
<body>
 <header><div class="gh-logo"><div class="r1">GH<span class="sq"></span>ST</div><div class="r2">RESEARCH</div></div></header>
 <main>
 <div class="eyebrow">Drops June 1, 2026</div>
 <div class="h1">The three PJM nodes every energy desk is now stress-testing — and the <em>one</em> nobody is naming yet.</div>
 <div class="rule"></div>
 <div class="sub">Atlas drops June 1. Caspr-powered, expert-vetted, FERC-traceable.</div>
 </main>
 <footer class="bottom">
 <span class="cta">Reserve early access</span>
 <div class="src">1M+ curated sources · Expert-vetted</div>
 </footer>
</body></html>
