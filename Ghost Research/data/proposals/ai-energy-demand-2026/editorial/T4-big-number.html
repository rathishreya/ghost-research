<!doctype html><html lang="en"><head><meta charset="utf-8"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oranienbaum&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%}
  body{position:relative;overflow:hidden;width:100%;height:100vh;color:#0E0E2A;
    font-family:'Manrope',system-ui,sans-serif;background:#F1F3FF;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  .circ{position:absolute;border-radius:50%;pointer-events:none}
  .c1{width:560px;height:560px;top:-160px;right:-170px;border:2px solid rgba(239,68,68,.10)}
  .c2{width:300px;height:300px;top:-30px;right:120px;border:2px solid rgba(14,14,42,.06)}

  .content{position:relative;z-index:2;width:100%;height:100vh;padding:8.4%;display:flex;flex-direction:column}
  .top{display:flex;align-items:flex-start;justify-content:space-between}
  .logo{width:84px;height:84px;background:#EF4444;border-radius:22px;position:relative;flex-shrink:0;box-shadow:0 10px 30px rgba(239,68,68,.22)}
  .logo::after{content:"";position:absolute;inset:25px;background:#fff;border-radius:9px}
  .kick{text-align:right;font-size:20px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#EF4444;padding-top:8px}

  .hero{margin-top:auto}
  .eyebrow{font-size:30px;font-weight:600;color:rgba(14,14,42,.6);margin-bottom:4px}
  .big{font-family:'Oranienbaum',serif;font-size:330px;line-height:.8;color:#EF4444;letter-spacing:-.04em}
  .sub{font-size:36px;line-height:1.32;color:#0E0E2A;margin-top:26px;max-width:21ch;font-weight:600}
  .sub em{font-style:normal;color:#EF4444}

  .foot{display:flex;align-items:center;justify-content:space-between;margin-top:46px}
  .site{font-size:30px;font-weight:700;color:#0E0E2A}
  .cta{background:#EF4444;color:#fff;font-weight:700;font-size:23px;padding:18px 32px;border-radius:14px;box-shadow:0 12px 30px rgba(239,68,68,.30)}
</style></head><body>
  <div class="circ c1"></div><div class="circ c2"></div>
  <div class="content">
    <div class="top">
      <div class="logo"></div>
      <div class="kick">The AI Energy<br>Demand Atlas</div>
    </div>
    <div class="hero">
      <div class="eyebrow">Everyone quotes</div>
      <div class="big">$147B</div>
      <p class="sub">Almost no one mapped the <em>9 utilities</em> that absorbed it. The Atlas does.</p>
    </div>
    <div class="foot">
      <div class="site">Ghostresearch.com</div>
      <div class="cta">Read the Atlas &rarr;</div>
    </div>
  </div>
</body></html>
