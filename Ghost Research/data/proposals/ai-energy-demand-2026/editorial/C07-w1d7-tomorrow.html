<!doctype html>
<html><head><meta charset="utf-8"/>
<link href="https://fonts.googleapis.com/css2?family=Oranienbaum&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
 *{box-sizing:border-box;margin:0;padding:0}
  .gh-logo{display:inline-flex;flex-direction:column;gap:2px;align-items:flex-start;line-height:1;font-family:'Oranienbaum',serif;color:#FFFFFF;text-decoration:none}
  .gh-logo .r1{display:flex;align-items:center;font-size:42px;letter-spacing:-.01em;font-weight:400}
  .gh-logo .sq{position:relative;width:34px;height:34px;background:#EF4444;border-radius:7px;display:inline-block;margin:0 3px;flex-shrink:0;align-self:center;transform:translateY(2px)}
  .gh-logo .sq::after{content:"";position:absolute;inset:11px;background:#FFFFFF;border-radius:2px}
  .gh-logo .r2{font-size:18px;letter-spacing:.42em;font-weight:400;color:#FFFFFF;margin-left:1px;margin-top:3px}
  .gh-logo.dark .r1, .gh-logo.dark .r2{color:#000000}
 body{background:linear-gradient(135deg,#181650 0%,#06062D 100%);color:#F8F8FF;
 font-family:'Manrope',sans-serif;width:100%;height:100vh;padding:6.5%;
 display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
 /* faint PJM-style watermark map texture suggestion using radial gradients */
 .grid-bg{position:absolute;inset:0;background:
 radial-gradient(circle at 22% 38%, rgba(255,255,255,.06) 0px, transparent 80px),
 radial-gradient(circle at 38% 22%, rgba(255,255,255,.05) 0px, transparent 100px),
 radial-gradient(circle at 55% 52%, rgba(255,255,255,.07) 0px, transparent 120px),
 radial-gradient(circle at 72% 35%, rgba(255,255,255,.05) 0px, transparent 90px),
 radial-gradient(circle at 80% 65%, rgba(239,68,68,.45) 0px, transparent 28px);
 z-index:0}
 .content{position:relative;z-index:1;display:flex;flex-direction:column;justify-content:space-between;height:100%}
  .eyebrow{font-size:20px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:#EF4444;text-align:center}
  .hero{font-family:'Oranienbaum',serif;font-size:clamp(140px,19vh,210px);line-height:.92;letter-spacing:-.04em;color:#FFFFFF;text-align:center;margin-top:18px}
  .subhero{font-family:'Oranienbaum',serif;font-size:clamp(40px,5.4vh,58px);line-height:1.04;color:#FFFFFF;text-align:center;margin-top:14px;max-width:18ch}
  .subhero em{color:#EF4444;font-style:italic}
  .rule{height:3px;width:120px;background:#EF4444;margin:28px auto 22px}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;max-width:520px;margin:0 auto;width:100%}
  .stat-cell{text-align:center;padding:14px 8px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)}
  .stat-cell .n{font-family:'Oranienbaum',serif;font-size:44px;color:#EF4444;line-height:1}
  .stat-cell .t{font-family:'Manrope',sans-serif;font-size:14px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.78);margin-top:4px}
  .cta{display:inline-flex;background:#EF4444;color:#FFFFFF;padding:20px 32px;border-radius:3px;font-weight:800;font-size:22px;letter-spacing:.02em;gap:14px}
  .cta:after{content:"→"}
  .footrow{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-top:24px}
  .src{font-size:17px;color:rgba(255,255,255,.7);text-align:right;line-height:1.4;max-width:26ch}
</style></head>
<body>
  <div class="grid-bg"></div>
  <div class="content">
    <header style="display:flex;justify-content:space-between;align-items:flex-start">
      <div class="gh-logo"><div class="r1">GH<span class="sq"></span>ST</div><div class="r2">RESEARCH</div></div>
      <div class="eyebrow">Drops June 1, 2026</div>
    </header>
    <main style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px">
      <div class="hero">24 hours.</div>
      <div class="subhero">until 9 utilities are <em>named.</em></div>
      <div class="rule"></div>
      <div class="stat-grid">
        <div class="stat-cell"><div class="n">$147B</div><div class="t">capex absorbed</div></div>
        <div class="stat-cell"><div class="n">31 GW</div><div class="t">new demand</div></div>
        <div class="stat-cell"><div class="n">3</div><div class="t">already priced</div></div>
      </div>
    </main>
    <footer class="footrow">
      <a class="cta">Get on the drop list</a>
      <div class="src">The AI Energy Demand Atlas 2026<br/>Caspr-powered · Expert-vetted</div>
    </footer>
  </div>
</body></html>
