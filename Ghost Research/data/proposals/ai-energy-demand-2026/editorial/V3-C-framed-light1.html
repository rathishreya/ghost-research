<!doctype html><html lang="en"><head><meta charset="utf-8"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oranienbaum&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%}
  body{position:relative;overflow:hidden;width:100%;height:100vh;color:#0E0E2A;
    font-family:'Manrope',system-ui,sans-serif;background:#F1F3FF;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  .circ{position:absolute;border-radius:50%;pointer-events:none}
  .c1{width:430px;height:430px;bottom:-150px;left:-150px;border:1.5px solid rgba(14,14,42,.05)}

  /* photo lives inside a contained rounded card with cream margin all around — no bleed line */
  .card{position:absolute;right:6.5%;top:7.5%;bottom:7.5%;width:40%;z-index:1;border-radius:30px;overflow:hidden;
    box-shadow:0 40px 80px rgba(14,14,42,.20), 0 6px 18px rgba(14,14,42,.10);
    background:
      linear-gradient(180deg, rgba(24,22,80,.06) 0%, rgba(6,6,40,.42) 100%),
      url("file:///C:/Users/Shreyanshi%20Rathi/Desktop/Ghost%20research/Ghost%20Research/data/proposals/ai-energy-demand-2026/assets/REAL-exec-white.jpg") center 14% / cover no-repeat;}

  .content{position:relative;z-index:3;width:100%;height:100vh;
    padding:7.8% 50% 7.8% 8.6%;display:flex;flex-direction:column}
  .logo{width:84px;height:84px;background:#EF4444;border-radius:22px;position:relative;flex-shrink:0;
    box-shadow:0 10px 30px rgba(239,68,68,.22)}
  .logo::after{content:"";position:absolute;inset:25px;background:#fff;border-radius:9px}
  .block{margin-top:auto;margin-bottom:auto}
  .kick{font-size:20px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#EF4444;margin-bottom:14px}
  .redrule{width:64px;height:5px;background:#EF4444;border-radius:3px;margin-bottom:22px}
  .h1{font-weight:800;font-size:53px;line-height:1.05;letter-spacing:-.015em;color:#0E0E2A}
  .stat{font-family:'Oranienbaum',serif;font-size:130px;line-height:.92;color:#EF4444;letter-spacing:-.02em;margin-top:16px}
  .sub{font-size:29px;line-height:1.36;color:rgba(14,14,42,.72);margin-top:16px;font-weight:500}
  .cta{display:inline-block;margin-top:32px;background:#EF4444;color:#fff;font-weight:700;font-size:23px;
    padding:18px 32px;border-radius:14px;box-shadow:0 12px 30px rgba(239,68,68,.30)}
  .site{margin-top:auto;font-size:29px;font-weight:600;color:#0E0E2A}
</style></head><body>
  <div class="circ c1"></div>
  <div class="card"></div>
  <div class="content">
    <div class="logo"></div>
    <div class="block">
      <div class="kick">The Atlas is live</div>
      <div class="redrule"></div>
      <h1 class="h1">The repricing<br>has started.</h1>
      <div class="stat">18&ndash;22%</div>
      <p class="sub">How far three utilities have already repriced on AI demand. Six are next.</p>
      <a class="cta">Read the Atlas &rarr;</a>
    </div>
    <div class="site">Ghostresearch.com</div>
  </div>
</body></html>
