<!doctype html>
<html><head><meta charset="utf-8"/>
<link href="https://fonts.googleapis.com/css2?family=Oranienbaum&family=Manrope:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
 *{box-sizing:border-box;margin:0;padding:0}
  .gh-logo{display:inline-flex;flex-direction:column;gap:2px;align-items:flex-start;line-height:1;font-family:'Oranienbaum',serif;color:#FFFFFF;text-decoration:none}
  .gh-logo .r1{display:flex;align-items:center;font-size:42px;letter-spacing:-.01em;font-weight:400}
  .gh-logo .sq{position:relative;width:34px;height:34px;background:#EF4444;border-radius:7px;display:inline-block;margin:0 3px;flex-shrink:0;align-self:center;transform:translateY(2px)}
  .gh-logo .sq::after{content:"";position:absolute;inset:11px;background:#FFFFFF;border-radius:2px}
  .gh-logo .r2{font-size:18px;letter-spacing:.42em;font-weight:400;color:#FFFFFF;margin-left:1px;margin-top:3px}
  .gh-logo.dark .r1, .gh-logo.dark .r2{color:#000000}
  body{background:#06062D;font-family:'Manrope',sans-serif;color:#FFFFFF;
    width:100%;height:100vh;display:grid;grid-template-rows:50% 50%;overflow:hidden}
  .top{position:relative;background:
    linear-gradient(180deg, rgba(6,6,45,0.05) 0%, rgba(6,6,45,0.75) 100%),
    url("file:///C:/Users/Shreyanshi%20Rathi/Desktop/Ghost%20research/Ghost%20Research/data/proposals/ai-energy-demand-2026/assets/P07-boardroom-occupied-atlas.jpg") center/cover no-repeat;
    padding:6.5%}
  .bottom{background:#06062D;padding:6.5%;display:flex;flex-direction:column;justify-content:space-between}
  .eyebrow-row{display:flex;align-items:center;gap:14px;margin-bottom:16px}
  .dot{display:inline-block;width:14px;height:14px;border-radius:50%;background:#EF4444;animation:pulse 1.6s infinite}
  @keyframes pulse{0%{opacity:1}50%{opacity:.4}100%{opacity:1}}
  .eyebrow{font-size:18px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:#EF4444}
  .h1{font-family:'Oranienbaum',serif;font-size:clamp(64px,8.8vh,92px);line-height:.98;letter-spacing:-.02em;color:#FFFFFF;max-width:14ch;margin-bottom:16px}
  .h1 em{font-style:italic;color:#EF4444;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:8px}
  .sub{font-family:'Manrope',sans-serif;font-size:22px;font-weight:500;color:rgba(255,255,255,.82);max-width:36ch;margin-bottom:22px;line-height:1.4}
  .cta{display:inline-flex;background:#EF4444;color:#FFFFFF;padding:22px 36px;border-radius:3px;font-weight:800;font-size:23px;letter-spacing:.02em;gap:14px}
  .cta:after{content:"→"}
  .footer{font-size:17px;font-weight:600;letter-spacing:.06em;color:rgba(255,255,255,.78);margin-top:18px;line-height:1.4}
</style></head>
<body>
  <div class="top"><div class="gh-logo"><div class="r1">GH<span class="sq"></span>ST</div><div class="r2">RESEARCH</div></div></div>
  <div class="bottom">
    <div>
      <div class="eyebrow-row"><span class="dot"></span><span class="eyebrow">You came back · Atlas available now</span></div>
      <div class="h1">The <em>6 utilities</em> next in line aren't staying quiet long.</div>
      <div class="sub">3 already moved. 18–22%. The full map is one click.</div>
    </div>
    <div>
      <a class="cta">Read the Atlas</a>
      <div class="footer">Caspr-powered · Expert-vetted · FERC-traceable</div>
    </div>
  </div>
</body></html>
