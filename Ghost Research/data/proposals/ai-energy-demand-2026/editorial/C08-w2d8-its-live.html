<!doctype html>
<html><head><meta charset="utf-8"/>
<link href="https://fonts.googleapis.com/css2?family=Oranienbaum&family=Manrope:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
 *{box-sizing:border-box;margin:0;padding:0}
  .gh-logo{display:inline-flex;flex-direction:column;gap:2px;align-items:flex-start;line-height:1;font-family:'Oranienbaum',serif;color:#FFFFFF;text-decoration:none}
  .gh-logo .r1{display:flex;align-items:center;font-size:42px;letter-spacing:-.01em;font-weight:400}
  .gh-logo .sq{position:relative;width:34px;height:34px;background:#EF4444;border-radius:7px;display:inline-block;margin:0 3px;flex-shrink:0;align-self:center;transform:translateY(2px)}
  .gh-logo .sq::after{content:"";position:absolute;inset:11px;background:#FFFFFF;border-radius:2px}
  .gh-logo .r2{font-size:18px;letter-spacing:.42em;font-weight:400;color:#FFFFFF;margin-left:1px;margin-top:3px}
  .gh-logo.dark .r1, .gh-logo.dark .r2{color:#000000}
 body{background:
 linear-gradient(180deg, rgba(6,6,45,0.10) 0%, rgba(6,6,45,0.50) 50%, rgba(6,6,45,0.95) 100%),
 url("file:///C:/Users/Shreyanshi%20Rathi/Desktop/Ghost%20research/Ghost%20Research/data/proposals/ai-energy-demand-2026/assets/P06-atlas-open-hand-pen.jpg") center/cover no-repeat;
 font-family:'Manrope',sans-serif;color:#FFFFFF;
 width:100%;height:100vh;display:flex;flex-direction:column;overflow:hidden}
 .top-zone{padding:6.5% 6.5% 0;flex:0 0 auto}
  .mid-zone{flex:1 1 auto;padding:0 6.5%;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:24px}
 .h1{font-family:'Oranienbaum',serif;font-size:clamp(64px,9vh,98px);line-height:1.0;letter-spacing:-.02em;max-width:13ch;color:#FFFFFF;text-shadow:0 6px 28px rgba(0,0,0,.6)}
 .h1 strong{font-weight:400;color:#EF4444}
 .stripe{flex:0 0 auto;background:#EF4444;padding:22px 6.5%;color:#FFFFFF;
 font-family:'Manrope',sans-serif;font-size:18px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;display:flex;align-items:center;gap:14px}
 .stripe span{font-family:'Oranienbaum',serif;font-style:italic;font-weight:400;letter-spacing:0;text-transform:none;font-size:30px}
 .bottom-zone{flex:0 0 auto;padding:5% 6.5%;display:flex;align-items:center;justify-content:space-between;gap:20px;background:#06062D}
 .cta{display:inline-flex;background:#EF4444;color:#FFFFFF;padding:20px 32px;border-radius:3px;font-weight:800;font-size:21px;letter-spacing:.02em;gap:14px}
 .cta:after{content:"→"}
 .src{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.7);text-align:right;max-width:18ch}
</style></head>
<body>
 <div class="top-zone"><div class="gh-logo"><div class="r1">GH<span class="sq"></span>ST</div><div class="r2">RESEARCH</div></div></div>
 <div class="mid-zone">
 <div class="h1"><strong>3 utilities</strong> just repriced 18&ndash;22%.</div>
 </div>
 <div class="stripe"><span>It's live.</span>Atlas available · names them all.</div>
 <div class="bottom-zone">
 <a class="cta">Read the Atlas </a>
 <div class="src">Caspr · Expert-vetted · FERC-traceable</div>
 </div>
</body></html>
