<!doctype html><html lang="en"><head><meta charset="utf-8"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oranienbaum&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%}
  body{position:relative;overflow:hidden;width:100%;height:100vh;color:#F6F6FC;
    font-family:'Manrope',system-ui,sans-serif;
    background:
      linear-gradient(180deg, rgba(6,6,40,.86) 0%, rgba(6,6,40,.30) 28%, rgba(6,6,40,.10) 55%, rgba(5,5,26,.92) 100%),
      linear-gradient(0deg, rgba(20,18,74,.20), rgba(20,18,74,.20)),
      url("file:///C:/Users/Shreyanshi%20Rathi/Desktop/Ghost%20research/Ghost%20Research/data/proposals/ai-energy-demand-2026/assets/BASE-citation.jpg") center center / cover no-repeat;
    background-blend-mode: normal, multiply, normal;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  .content{position:relative;z-index:2;width:100%;height:100vh;padding:7.6%;display:flex;flex-direction:column;justify-content:space-between}

  .top{display:flex;align-items:flex-start;justify-content:space-between}
  .logo{width:80px;height:80px;background:#EF4444;border-radius:21px;position:relative;flex-shrink:0;box-shadow:0 8px 26px rgba(0,0,0,.45)}
  .logo::after{content:"";position:absolute;inset:24px;background:#fff;border-radius:8px}
  .kick{text-align:right;font-size:18px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#FF6A5C;padding-top:8px;text-shadow:0 2px 12px rgba(0,0,0,.8)}

  .head{margin-top:24px}
  .h1{font-family:'Oranienbaum',serif;font-size:78px;line-height:.99;letter-spacing:-.01em;max-width:12ch;text-shadow:0 6px 34px rgba(0,0,0,.7)}
  .h1 em{font-style:normal;color:#FF6A5C}

  .hero{}
  .sub{font-size:31px;line-height:1.36;color:#fff;max-width:25ch;font-weight:500;text-shadow:0 2px 16px rgba(0,0,0,.9)}
  .sub b{color:#FF8C82;font-weight:700}
  .foot{display:flex;align-items:center;justify-content:space-between;margin-top:28px}
  .site{font-size:29px;font-weight:700;text-shadow:0 2px 12px rgba(0,0,0,.85)}
  .cta{background:#EF4444;color:#fff;font-weight:700;font-size:23px;padding:18px 32px;border-radius:14px;box-shadow:0 12px 30px rgba(239,68,68,.4)}
</style></head><body>
  <div class="content">
    <div>
      <div class="top">
        <div class="logo"></div>
        <div class="kick">Why analysts<br>trust the Atlas</div>
      </div>
      <div class="head"><div class="h1">Every number,<br>traced to its <em>source.</em></div></div>
    </div>
    <div class="hero">
      <p class="sub"><b>1M+ verified sources</b> — filings, journals, disclosures. Every claim cited. Every report expert-vetted. No black box.</p>
      <div class="foot">
        <div class="site">Ghostresearch.com</div>
        <div class="cta">Read the Atlas &rarr;</div>
      </div>
    </div>
  </div>
</body></html>
