<!doctype html><html lang="en"><head><meta charset="utf-8"/>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Oranienbaum&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

  html,body{width:100%;height:100%}

  .kick{text-align:right;font-size:19px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#fff;padding-top:8px;text-shadow:0 2px 12px rgba(0,0,0,.8)}
  .kick b{color:#FF6A5C}

  .hero{margin-top:auto}
  .redbar{display:inline-block;background:#0E0E2A;color:#0E0E2A;border-radius:4px;padding:0 14px;user-select:none}
  .h1{font-family:'Oranienbaum',serif;font-size:84px;line-height:1.0;letter-spacing:-.01em;max-width:13ch;text-shadow:0 6px 34px rgba(0,0,0,.7)}
  .h1 em{font-style:normal;color:#FF6A5C}
  .sub{font-size:31px;line-height:1.34;color:#fff;margin-top:20px;max-width:24ch;font-weight:500;text-shadow:0 2px 16px rgba(0,0,0,.9)}
  .foot{display:flex;align-items:center;justify-content:space-between;margin-top:34px}
  .site{font-size:29px;font-weight:700;text-shadow:0 2px 12px rgba(0,0,0,.85)}
  .cta{background:#EF4444;color:#fff;font-weight:700;font-size:23px;padding:18px 32px;border-radius:14px;box-shadow:0 12px 30px rgba(239,68,68,.4)}

  <div class="frame"></div>

    <div class="top">

    <div class="hero">

      <div class="foot">
        <div class="site">Ghostresearch.com</div>

    </div>
