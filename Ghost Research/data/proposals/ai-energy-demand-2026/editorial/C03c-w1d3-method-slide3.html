<!doctype html>
<html><head><meta charset="utf-8"/>
<link href="https://fonts.googleapis.com/css2?family=Oranienbaum&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
 *{box-sizing:border-box;margin:0;padding:0}
  .gh-logo{display:inline-flex;flex-direction:column;gap:2px;align-items:flex-start;line-height:1;font-family:'Oranienbaum',serif;color:#FFFFFF;text-decoration:none}
  .gh-logo .r1{display:flex;align-items:center;font-size:42px;letter-spacing:-.01em;font-weight:400}
  .gh-logo .sq{position:relative;width:34px;height:34px;background:#EF4444;border-radius:7px;display:inline-block;margin:0 3px;flex-shrink:0;align-self:center;transform:translateY(2px)}
  .gh-logo .sq::after{content:"";position:absolute;inset:11px;background:#FFFFFF;border-radius:2px}
  .gh-logo .r2{font-size:18px;letter-spacing:.42em;font-weight:400;color:#FFFFFF;margin-left:1px;margin-top:3px}
  .gh-logo.dark .r1, .gh-logo.dark .r2{color:#000000}
  body{background:#06062D;font-family:'Manrope',sans-serif;color:#FFFFFF;
    width:100%;height:100vh;display:grid;grid-template-columns:50% 50%;overflow:hidden}
  .left{position:relative;background:
    linear-gradient(180deg, rgba(6,6,45,0.12) 0%, rgba(6,6,45,0.78) 100%),
    url("file:///C:/Users/Shreyanshi%20Rathi/Desktop/Ghost%20research/Ghost%20Research/data/proposals/ai-energy-demand-2026/assets/P06-atlas-open-hand-pen.jpg") center/cover no-repeat;
    padding:6.5%}
  .slidenum-tag{position:absolute;bottom:6.5%;left:6.5%;font-size:15px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.7)}
  .right{background:#06062D;padding:6.5%;display:flex;flex-direction:column;justify-content:space-between}
  .eyebrow{font-size:18px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:#EF4444;margin-bottom:14px}
  .date{font-family:'Oranienbaum',serif;font-size:clamp(120px,17vh,200px);line-height:.86;letter-spacing:-.04em;color:#EF4444;margin-bottom:8px}
  .h1{font-family:'Oranienbaum',serif;font-size:clamp(40px,5.4vh,56px);line-height:1.04;color:#FFFFFF;max-width:14ch;margin-bottom:18px}
  .sub{font-size:20px;font-weight:500;color:rgba(255,255,255,.86);max-width:32ch;line-height:1.45;margin-bottom:24px}
  .cta{display:inline-flex;background:#EF4444;color:#FFFFFF;padding:22px 34px;border-radius:3px;font-weight:800;font-size:23px;letter-spacing:.02em;gap:14px;align-self:flex-start}
  .cta:after{content:"→"}
  .footer-cred{font-size:17px;font-weight:600;letter-spacing:.06em;color:rgba(255,255,255,.78);line-height:1.4;margin-top:auto}
</style></head>
<body>
  <div class="left">
    <div class="gh-logo"><div class="r1">GH<span class="sq"></span>ST</div><div class="r2">RESEARCH</div></div>
    <div class="slidenum-tag">3 / 3</div>
  </div>
  <div class="right">
    <div>
      <div class="eyebrow">Mark your calendar</div>
      <div class="date">June 1</div>
      <div class="h1">The AI Energy Demand Atlas drops.</div>
      <div class="sub">9 utilities. 31 GW. 3 trades that already priced. Be on the list.</div>
      <a class="cta">Get on the drop list</a>
    </div>
    <div class="footer-cred">ghostresearch.com/atlas-drop-list · Caspr-powered</div>
  </div>
</body></html>
