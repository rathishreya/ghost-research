<!doctype html>
<html><head><meta charset="utf-8"/>
<link href="https://fonts.googleapis.com/css2?family=Oranienbaum&family=Manrope:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  .gh-logo{display:inline-flex;flex-direction:column;gap:2px;align-items:flex-start;line-height:1;font-family:'Oranienbaum',serif;color:#000000;text-decoration:none}
  .gh-logo .r1{display:flex;align-items:center;font-size:42px;letter-spacing:-.01em;font-weight:400}
  .gh-logo .sq{position:relative;width:34px;height:34px;background:#EF4444;border-radius:7px;display:inline-block;margin:0 3px;flex-shrink:0;align-self:center;transform:translateY(2px)}
  .gh-logo .sq::after{content:"";position:absolute;inset:11px;background:#FFFFFF;border-radius:2px}
  .gh-logo .r2{font-size:18px;letter-spacing:.42em;font-weight:400;color:#000000;margin-left:1px;margin-top:3px}
  body{background:#F1F3FF;font-family:'Manrope',sans-serif;color:#000000;
    width:100%;height:100vh;display:grid;grid-template-rows:54% 46%;overflow:hidden}
  .top{position:relative;background:
    linear-gradient(180deg, rgba(241,243,255,0.0) 0%, rgba(241,243,255,0.0) 65%, rgba(241,243,255,0.95) 100%),
    url("file:///C:/Users/Shreyanshi%20Rathi/Desktop/Ghost%20research/Ghost%20Research/data/proposals/ai-energy-demand-2026/assets/P05-atlas-closed-light.jpg") center/cover no-repeat;
    padding:6.5%}
  .bottom{background:#F1F3FF;padding:6.5%;display:flex;flex-direction:column;justify-content:space-between}
  .eyebrow{font-size:20px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:#EF4444;margin-bottom:18px}
  .h1{font-family:'Oranienbaum',serif;font-size:clamp(62px,8.4vh,86px);line-height:1.02;letter-spacing:-.01em;color:#000000;max-width:14ch;margin-bottom:14px}
  .h1 strong{font-weight:400;color:#EF4444}
  .sub{font-family:'Manrope',sans-serif;font-size:22px;line-height:1.5;color:rgba(0,0,0,.74);max-width:34ch;margin-bottom:22px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-top:auto}
  .cta{display:inline-flex;background:#EF4444;color:#FFFFFF;padding:20px 32px;border-radius:3px;font-weight:800;font-size:22px;letter-spacing:.02em;gap:14px}
  .cta:after{content:"→"}
  .src{font-size:17px;letter-spacing:.06em;color:rgba(0,0,0,.62);text-align:right;line-height:1.4;max-width:22ch}
</style></head>
<body>
  <div class="top">
    <div class="gh-logo"><div class="r1">GH<span class="sq"></span>ST</div><div class="r2">RESEARCH</div></div>
  </div>
  <div class="bottom">
    <div>
      <div class="eyebrow">Drops Monday · June 1, 2026</div>
      <div class="h1">The atlas <strong>drops Monday.</strong></div>
      <div class="sub">9 utilities. 31 GW absorbed. 3 trades already priced.</div>
    </div>
    <div class="row">
      <a class="cta">Notify me Monday</a>
      <div class="src">Caspr-powered · Expert-vetted · FERC-traceable</div>
    </div>
  </div>
</body></html>
