<!doctype html><html lang="en"><head><meta charset="utf-8"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oranienbaum&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%}
  body{position:relative;overflow:hidden;width:100%;height:100vh;color:#0E0E2A;
    font-family:'Manrope',system-ui,sans-serif;background:#F1F3FF;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}

  .circ{position:absolute;border-radius:50%;pointer-events:none}
  .c1{width:520px;height:520px;top:-150px;left:-170px;border:1.5px solid rgba(14,14,42,.06)}
  .c2{width:240px;height:240px;bottom:6%;left:4%;border:1.5px solid rgba(239,68,68,.10)}

  /* RIGHT photo panel — real data-center bleed, feathered into cream */
  .photo{position:absolute;top:0;right:0;bottom:0;width:47%;z-index:1;
    background:
      linear-gradient(90deg,#F1F3FF 0%, rgba(241,243,255,.5) 7%, rgba(241,243,255,0) 24%),
      linear-gradient(180deg, rgba(24,22,80,.10), rgba(6,6,40,.30)),
      url("file:///C:/Users/Shreyanshi%20Rathi/Desktop/Ghost%20research/Ghost%20Research/data/proposals/ai-energy-demand-2026/assets/REAL-datacenter.jpg") center center / cover no-repeat;}
  .seam{position:absolute;top:0;bottom:0;right:47%;width:4px;background:#EF4444;z-index:2;opacity:.92;
    box-shadow:0 0 24px rgba(239,68,68,.28)}

  .content{position:relative;z-index:3;width:100%;height:100vh;
    padding:7.6% 50% 7.6% 8.6%;display:flex;flex-direction:column}
  .logo{width:84px;height:84px;background:#EF4444;border-radius:22px;position:relative;flex-shrink:0;
    box-shadow:0 10px 30px rgba(239,68,68,.22)}
  .logo::after{content:"";position:absolute;inset:25px;background:#fff;border-radius:9px}

  .block{margin-top:auto;margin-bottom:auto}
  .kick{font-size:20px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#EF4444;margin-bottom:18px}
  .h1{font-family:'Manrope',sans-serif;font-weight:800;font-size:54px;line-height:1.07;letter-spacing:-.015em;color:#0E0E2A}
  .statline{display:flex;align-items:baseline;gap:18px;margin-top:18px}
  .stat{font-family:'Oranienbaum',serif;font-size:150px;line-height:.86;color:#EF4444;letter-spacing:-.02em}
  .statu{font-family:'Oranienbaum',serif;font-size:58px;color:#0E0E2A}
  .sub{font-size:30px;line-height:1.36;color:rgba(14,14,42,.72);margin-top:12px;font-weight:500}
  .cta{display:inline-block;margin-top:34px;background:#EF4444;color:#fff;font-weight:700;font-size:24px;
    padding:19px 34px;border-radius:14px;letter-spacing:.005em;box-shadow:0 12px 30px rgba(239,68,68,.30)}

  .site{margin-top:auto;font-size:30px;font-weight:600;color:#0E0E2A;letter-spacing:.01em}
</style></head><body>
  <div class="circ c1"></div><div class="circ c2"></div>
  <div class="photo"></div>
  <div class="seam"></div>
  <div class="content">
    <div class="logo"></div>
    <div class="block">
      <div class="kick">Drops June 1, 2026</div>
      <h1 class="h1">Where $147B in<br>AI capex landed.</h1>
      <div class="statline"><div class="stat">9</div><div class="statu">utilities</div></div>
      <p class="sub">absorbed the load. The Atlas names them &mdash; and the six next in line.</p>
      <a class="cta">Get on the drop list &rarr;</a>
    </div>
    <div class="site">Ghostresearch.com</div>
  </div>
</body></html>
