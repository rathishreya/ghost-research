<!doctype html>
<html><head><meta charset="utf-8"/>
<link href="https://fonts.googleapis.com/css2?family=Oranienbaum&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
 *{box-sizing:border-box;margin:0;padding:0}
  .gh-logo{display:inline-flex;flex-direction:column;gap:2px;align-items:flex-start;line-height:1;font-family:'Oranienbaum',serif;color:#FFFFFF;text-decoration:none}
  .gh-logo .r1{display:flex;align-items:center;font-size:42px;letter-spacing:-.01em;font-weight:400}
  .gh-logo .sq{position:relative;width:34px;height:34px;background:#EF4444;border-radius:7px;display:inline-block;margin:0 3px;flex-shrink:0;align-self:center;transform:translateY(2px)}
  .gh-logo .sq::after{content:"";position:absolute;inset:11px;background:#FFFFFF;border-radius:2px}
  .gh-logo .r2{font-size:18px;letter-spacing:.42em;font-weight:400;color:#FFFFFF;margin-left:1px;margin-top:3px}
  .gh-logo.dark .r1, .gh-logo.dark .r2{color:#000000}
  body{background:#06062D;font-family:'Manrope',sans-serif;color:#FFFFFF;
    width:100%;height:100vh;display:grid;grid-template-columns:50% 50%;overflow:hidden}
  .left{position:relative;background:
    linear-gradient(180deg, rgba(6,6,45,0.12) 0%, rgba(6,6,45,0.7) 100%),
    url("file:///C:/Users/Shreyanshi%20Rathi/Desktop/Ghost%20research/Ghost%20Research/data/proposals/ai-energy-demand-2026/assets/P04-trader-pjm-heatmap.jpg") center/cover no-repeat;
    padding:6.5%}
  .slidenum-tag{position:absolute;bottom:6.5%;left:6.5%;font-size:15px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.7)}
  .right{background:#EF4444;padding:6.5%;display:flex;flex-direction:column;justify-content:space-between;color:#FFFFFF}
  .eyebrow{font-size:18px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:#FFFFFF;opacity:.92;margin-bottom:16px}
  .h1{font-family:'Oranienbaum',serif;font-size:clamp(46px,6.4vh,64px);line-height:1.02;letter-spacing:-.01em;color:#FFFFFF;max-width:14ch;margin-bottom:22px}
  .chart{display:flex;flex-direction:column;gap:14px}
  .row{display:flex;align-items:center;gap:14px}
  .label{width:120px;font-size:17px;color:#FFFFFF;font-weight:700;letter-spacing:.06em}
  .bar{height:36px;background:rgba(0,0,0,.32);border:1.5px solid rgba(255,255,255,.45);position:relative;flex:1}
  .bar:after{content:"REDACTED";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#FFFFFF;font-family:'Manrope',sans-serif;font-size:13px;font-weight:800;letter-spacing:.28em}
  .sub{font-size:18px;color:#FFFFFF;opacity:.95;line-height:1.5;font-weight:500;max-width:32ch}
  .footer-cred{font-size:17px;font-weight:700;letter-spacing:.06em;color:#FFFFFF;opacity:.88;line-height:1.4}
</style></head>
<body>
  <div class="left">
    <div class="gh-logo"><div class="r1">GH<span class="sq"></span>ST</div><div class="r2">RESEARCH</div></div>
    <div class="slidenum-tag">2 / 3 · Swipe →</div>
  </div>
  <div class="right">
    <div>
      <div class="eyebrow">Q1 2026 priced moves</div>
      <div class="h1">We can't show the names. <em style="font-style:italic">Yet.</em></div>
      <div class="chart">
        <div class="row"><div class="label">Utility A</div><div class="bar" style="flex:0 0 88%"></div></div>
        <div class="row"><div class="label">Utility B</div><div class="bar" style="flex:0 0 84%"></div></div>
        <div class="row"><div class="label">Utility C</div><div class="bar" style="flex:0 0 72%"></div></div>
      </div>
      <div class="sub" style="margin-top:22px">3 PJM nodes already stress-testing. 18–22% moves on the tape.</div>
    </div>
    <div class="footer-cred">Atlas drops June 1 · Caspr-powered · Expert-vetted</div>
  </div>
</body></html>
