<!doctype html><html lang="en"><head><meta charset="utf-8"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oranienbaum&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%}
  body{position:relative;overflow:hidden;width:100%;height:100vh;
    font-family:'Manrope',system-ui,sans-serif;color:#F6F6FC;
    background:linear-gradient(155deg,#0A0A2E 0%,#0B0B33 45%,#06061F 100%);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}

  /* double-exposure photo layer (right-weighted, faded into the dark) */
  .photo{position:absolute;inset:0;z-index:0;
    background:url("file:///C:/Users/Shreyanshi%20Rathi/Desktop/Ghost%20research/Ghost%20Research/data/proposals/ai-energy-demand-2026/assets/CINE-01-substation.jpg") right center/cover no-repeat;
    opacity:.60;
    -webkit-mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.25) 26%,#000 60%);
    mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.25) 26%,#000 60%)}
  .photo::after{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(8,8,32,.45) 0%,rgba(8,8,32,.05) 40%,rgba(8,8,32,.78) 100%)}

  /* market chart overlay — double-exposure, screen-blended */
  .chartwrap{position:absolute;left:0;right:0;bottom:0;height:62%;z-index:1;
    mix-blend-mode:screen;opacity:.9;pointer-events:none}
  .chartwrap svg{width:100%;height:100%;display:block}

  /* red rounded brand frame */
  .frame-border{position:absolute;inset:34px;z-index:3;border:4px solid #EF4444;border-radius:42px;pointer-events:none}

  .content{position:relative;z-index:4;width:100%;height:100vh;padding:9% 8.5%;
    display:flex;flex-direction:column}
  .top{display:flex;align-items:flex-start;justify-content:space-between}
  .logo{width:84px;height:84px;background:#EF4444;border-radius:22px;position:relative;flex-shrink:0}
  .logo::after{content:"";position:absolute;inset:25px;background:#fff;border-radius:8px}
  .arrow{width:74px;height:74px;border:2.5px solid rgba(246,246,252,.85);border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:34px;color:#F6F6FC;font-weight:300}

  .hero{margin-top:8%}
  .h1{font-family:'Oranienbaum',serif;font-weight:400;font-size:128px;line-height:.98;
    letter-spacing:-.01em;color:#fff;text-shadow:0 6px 34px rgba(0,0,0,.6)}
  .sub{font-size:42px;line-height:1.3;color:rgba(246,246,252,.9);margin-top:40px;max-width:20ch;font-weight:500;
    text-shadow:0 3px 20px rgba(0,0,0,.6)}

  .foot{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between}
  .site{font-size:38px;font-weight:600;color:#F6F6FC;letter-spacing:.005em}
  .slashes{display:flex;gap:14px}
  .slashes i{display:block;width:26px;height:54px;border:3px solid rgba(246,246,252,.9);
    transform:skewX(-18deg);border-radius:3px}
</style></head><body>
  <div class="photo"></div>
  <div class="chartwrap">
    <svg viewBox="0 0 1000 620" preserveAspectRatio="none">
      <!-- candlesticks -->
      <g stroke-width="3">
        <line x1="70"  y1="380" x2="70"  y2="500" stroke="#16C784"/><rect x="58"  y="410" width="24" height="70"  fill="#16C784"/>
        <line x1="135" y1="350" x2="135" y2="470" stroke="#EF4444"/><rect x="123" y="380" width="24" height="60"  fill="#EF4444"/>
        <line x1="200" y1="330" x2="200" y2="450" stroke="#16C784"/><rect x="188" y="356" width="24" height="74"  fill="#16C784"/>
        <line x1="265" y1="360" x2="265" y2="486" stroke="#EF4444"/><rect x="253" y="392" width="24" height="64"  fill="#EF4444"/>
        <line x1="330" y1="300" x2="330" y2="430" stroke="#16C784"/><rect x="318" y="330" width="24" height="80"  fill="#16C784"/>
        <line x1="395" y1="320" x2="395" y2="448" stroke="#16C784"/><rect x="383" y="346" width="24" height="78"  fill="#16C784"/>
        <line x1="460" y1="280" x2="460" y2="404" stroke="#EF4444"/><rect x="448" y="306" width="24" height="74"  fill="#EF4444"/>
        <line x1="525" y1="250" x2="525" y2="380" stroke="#16C784"/><rect x="513" y="278" width="24" height="86"  fill="#16C784"/>
        <line x1="590" y1="270" x2="590" y2="392" stroke="#EF4444"/><rect x="578" y="298" width="24" height="70"  fill="#EF4444"/>
        <line x1="655" y1="220" x2="655" y2="348" stroke="#16C784"/><rect x="643" y="248" width="24" height="86"  fill="#16C784"/>
        <line x1="720" y1="200" x2="720" y2="320" stroke="#16C784"/><rect x="708" y="226" width="24" height="80"  fill="#16C784"/>
        <line x1="785" y1="230" x2="785" y2="356" stroke="#EF4444"/><rect x="773" y="258" width="24" height="72"  fill="#EF4444"/>
        <line x1="850" y1="170" x2="850" y2="300" stroke="#16C784"/><rect x="838" y="196" width="24" height="92"  fill="#16C784"/>
        <line x1="915" y1="140" x2="915" y2="264" stroke="#16C784"/><rect x="903" y="166" width="24" height="86"  fill="#16C784"/>
      </g>
      <!-- rising trend line -->
      <polyline fill="none" stroke="#5BD7DE" stroke-width="5"
        points="40,470 150,430 270,452 360,360 470,372 560,300 670,322 770,250 880,210 980,150"/>
      <!-- faint wandering price line -->
      <polyline fill="none" stroke="rgba(246,246,252,.5)" stroke-width="2.5"
        points="40,520 120,500 200,512 300,484 400,495 500,452 600,470 700,430 800,448 900,400 980,378"/>
    </svg>
  </div>
  <div class="frame-border"></div>

  <div class="content">
    <div class="top">
      <div class="logo"></div>
      <div class="arrow">&#8594;</div>
    </div>
    <div class="hero">
      <h1 class="h1">AI Energy<br>Demand.<br>Mapped.</h1>
      <p class="sub">Which 9 utilities. Which trades. Why now.</p>
    </div>
    <div class="foot">
      <div class="site">Ghostresearch.com</div>
      <div class="slashes"><i></i><i></i><i></i></div>
    </div>
  </div>
</body></html>
