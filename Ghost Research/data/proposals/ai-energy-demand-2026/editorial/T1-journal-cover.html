<!doctype html><html lang="en"><head><meta charset="utf-8"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oranienbaum&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%}
  body{position:relative;overflow:hidden;width:100%;height:100vh;color:#F6F6FC;
    font-family:'Manrope',system-ui,sans-serif;
    background:
      linear-gradient(180deg, rgba(6,6,40,.86) 0%, rgba(6,6,40,.30) 26%, rgba(6,6,40,.42) 60%, rgba(5,5,26,.97) 100%),
      linear-gradient(0deg, rgba(20,18,74,.55), rgba(20,18,74,.55)),
      url("file:///C:/Users/Shreyanshi%20Rathi/Desktop/Ghost%20research/Ghost%20Research/data/proposals/ai-energy-demand-2026/assets/REAL-coolingtowers.jpg") center center / cover no-repeat;
    background-blend-mode: normal, multiply, normal;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  .content{position:relative;z-index:2;width:100%;height:100vh;padding:7.4%;display:flex;flex-direction:column}

  .masthead{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid rgba(246,246,252,.32);padding-bottom:20px}
  .mh-left{display:flex;align-items:center;gap:18px}
  .logo{width:74px;height:74px;background:#EF4444;border-radius:19px;position:relative;flex-shrink:0;box-shadow:0 8px 26px rgba(0,0,0,.4)}
  .logo::after{content:"";position:absolute;inset:22px;background:#fff;border-radius:7px}
  .mh-name{font-weight:800;font-size:25px;letter-spacing:.16em;text-transform:uppercase}
  .mh-issue{font-size:18px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:rgba(246,246,252,.78);text-align:right}

  .mid{margin-top:auto}
  .kick{font-size:21px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:#FF6A5C;margin-bottom:14px;text-shadow:0 2px 14px rgba(0,0,0,.6)}
  .title{font-family:'Oranienbaum',serif;font-size:118px;line-height:.94;letter-spacing:-.02em;text-shadow:0 8px 40px rgba(0,0,0,.5)}
  .title b{color:#FF6A5C;font-weight:400}

  .lines{margin-top:34px;border-top:2px solid rgba(246,246,252,.28);padding-top:22px;display:flex;flex-direction:column;gap:13px}
  .li{display:flex;align-items:flex-start;gap:14px;font-size:27px;font-weight:500;color:rgba(246,246,252,.94);text-shadow:0 2px 12px rgba(0,0,0,.6)}
  .li .b{width:11px;height:11px;border-radius:50%;background:#EF4444;margin-top:11px;flex-shrink:0}
  .li em{font-style:normal;color:#FF8C82}

  .foot{display:flex;align-items:center;justify-content:space-between;margin-top:38px}
  .site{font-size:28px;font-weight:700;text-shadow:0 2px 12px rgba(0,0,0,.7)}
  .stamp{font-size:18px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:rgba(246,246,252,.78)}
</style></head><body>
  <div class="content">
    <div class="masthead">
      <div class="mh-left"><div class="logo"></div><div class="mh-name">Ghost Research</div></div>
      <div class="mh-issue">The Atlas<br>Drops June 1, 2026</div>
    </div>
    <div class="mid">
      <div class="kick">The AI Energy Demand Atlas</div>
      <div class="title">The <b>$147B</b><br>Map.</div>
      <div class="lines">
        <div class="li"><span class="b"></span><span>The <em>9 utilities</em> that absorbed it — ranked by exposure.</span></div>
        <div class="li"><span class="b"></span><span><em>18&ndash;22%</em> repricing, traced to FERC filings &amp; 10-Qs.</span></div>
        <div class="li"><span class="b"></span><span>And the <em>six</em> next in line.</span></div>
      </div>
    </div>
    <div class="foot">
      <div class="site">Ghostresearch.com</div>
      <div class="stamp">Expert-vetted · Fully cited</div>
    </div>
  </div>
</body></html>
