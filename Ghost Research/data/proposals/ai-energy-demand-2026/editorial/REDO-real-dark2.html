<!doctype html><html lang="en"><head><meta charset="utf-8"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oranienbaum&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%}
  body{position:relative;overflow:hidden;width:100%;height:100vh;
    font-family:'Manrope',system-ui,sans-serif;color:#F6F6FC;
    background:
      linear-gradient(180deg, rgba(6,6,40,.42) 0%, rgba(6,6,40,.12) 26%, rgba(6,6,40,.74) 64%, rgba(5,5,26,.97) 100%),
      linear-gradient(0deg, rgba(20,18,74,.34), rgba(20,18,74,.34)),
      url("file:///C:/Users/Shreyanshi%20Rathi/Desktop/Ghost%20research/Ghost%20Research/data/proposals/ai-energy-demand-2026/assets/REAL-datacenter.jpg") center/cover no-repeat;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  .frame-border{position:absolute;inset:34px;z-index:3;border:4px solid #EF4444;border-radius:42px;pointer-events:none}
  .content{position:relative;z-index:4;width:100%;height:100vh;padding:8.5%;display:flex;flex-direction:column;justify-content:space-between}
  .top{display:flex;align-items:flex-start;justify-content:space-between}
  .logo{width:82px;height:82px;background:#EF4444;border-radius:21px;position:relative;flex-shrink:0;box-shadow:0 8px 30px rgba(0,0,0,.35)}
  .logo::after{content:"";position:absolute;inset:24px;background:#fff;border-radius:8px}
  .kicker{font-size:21px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#fff;text-align:right;padding-top:10px;text-shadow:0 2px 14px rgba(0,0,0,.7)}
  .kicker b{color:#FF5A4D}
  .hero{margin-top:auto}
  .eyebrow{font-size:30px;font-weight:600;color:rgba(246,246,252,.92);text-shadow:0 2px 16px rgba(0,0,0,.75);margin-bottom:6px}
  .stat{font-family:'Oranienbaum',serif;font-size:184px;line-height:.9;color:#FF5A4D;letter-spacing:-.03em;text-shadow:0 8px 40px rgba(0,0,0,.55)}
  .stat .u{font-size:96px}
  .sub{font-size:36px;line-height:1.34;color:#fff;margin-top:18px;max-width:24ch;font-weight:500;text-shadow:0 2px 18px rgba(0,0,0,.8)}
  .sub em{font-style:normal;color:#FF8079}
  .foot{display:flex;align-items:flex-end;justify-content:space-between;margin-top:46px}
  .site{font-size:36px;font-weight:600;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.8)}
</style></head><body>
  <div class="frame-border"></div>
  <div class="content">
    <div class="top">
      <div class="logo"></div>
      <div class="kicker">The AI Energy Demand Atlas<br><b>Drops June 1, 2026</b></div>
    </div>
    <div class="hero">
      <div class="eyebrow">New AI demand just landed.</div>
      <div class="stat">31<span class="u">&#8201;GW</span></div>
      <p class="sub">On <em>9 utility balance sheets</em> — the load the grid wasn't built for.</p>
      <div class="foot"><div class="site">Ghostresearch.com</div></div>
    </div>
  </div>
</body></html>
