<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%}
  body{position:relative;overflow:hidden;width:100%;height:100vh;color:#F6F6FC;
    font-family:'Manrope',system-ui,sans-serif;
    background:
      linear-gradient(180deg, rgba(5,5,26,.90) 0%, rgba(5,5,26,.30) 22%, rgba(5,5,26,0) 40%, rgba(5,5,26,.32) 72%, rgba(5,5,26,.95) 100%),
      linear-gradient(0deg, rgba(20,18,74,.30), rgba(20,18,74,.30)),

  .kick{text-align:right;font-size:19px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#FF6A5C;padding-top:8px;text-shadow:0 2px 12px rgba(0,0,0,.7)}

  .head{margin-top:20px}
  .h1{font-family:'Oranienbaum',serif;font-size:74px;line-height:.98;letter-spacing:-.01em;max-width:13ch;text-shadow:0 6px 34px rgba(0,0,0,.6)}

  .hero{margin-top:auto}
  .sub{font-size:32px;line-height:1.34;color:#fff;max-width:22ch;font-weight:600;text-shadow:0 2px 16px rgba(0,0,0,.85)}
  .sub em{font-style:normal;color:#FF8C82}
  .foot{display:flex;align-items:center;justify-content:space-between;margin-top:30px}
  .site{font-size:29px;font-weight:700;text-shadow:0 2px 12px rgba(0,0,0,.8)}
  .cta{background:#EF4444;color:#fff;font-weight:700;font-size:23px;padding:18px 32px;border-radius:14px;box-shadow:0 12px 30px rgba(239,68,68,.4)}
</style></head><body>
  <div class="content">
    <div class="top">
      <div class="logo"></div>
      <div class="kick">The AI Energy<br>Demand Atlas</div>
    </div>
    <div class="head">
      <div class="h1">The map every<br>energy desk<br>will quote.</div>
    </div>
    <div class="hero">
      <p class="sub"><em>9 utilities. $147B.</em> Every claim traced to filings, expert-vetted.</p>
      <div class="foot">
        <div class="site">Ghostresearch.com</div>
        <div class="cta">Get on the drop list &rarr;</div>
      </div>
    </div>
  </div>
</body></html>
