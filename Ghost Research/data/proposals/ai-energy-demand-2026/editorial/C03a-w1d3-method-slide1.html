<!doctype html>
<html><head><meta charset="utf-8"/>
<link href="https://fonts.googleapis.com/css2?family=Oranienbaum&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
 *{box-sizing:border-box;margin:0;padding:0}
  .gh-logo{display:inline-flex;flex-direction:column;gap:2px;align-items:flex-start;line-height:1;font-family:'Oranienbaum',serif;color:#FFFFFF;text-decoration:none}
  .gh-logo .r1{display:flex;align-items:center;font-size:42px;letter-spacing:-.01em;font-weight:400}
  .gh-logo .sq{position:relative;width:34px;height:34px;background:#EF4444;border-radius:7px;display:inline-block;margin:0 3px;flex-shrink:0;align-self:center;transform:translateY(2px)}
  .gh-logo .sq::after{content:"";position:absolute;inset:11px;background:#FFFFFF;border-radius:2px}
  .gh-logo .r2{font-size:18px;letter-spacing:.42em;font-weight:400;color:#FFFFFF;margin-left:1px;margin-top:3px}
  .gh-logo.dark .r1, .gh-logo.dark .r2{color:#000000}
  body{background:#06062D;font-family:'Manrope',sans-serif;color:#FFFFFF;
    width:100%;height:100vh;display:grid;grid-template-columns:50% 50%;overflow:hidden}
  .left{position:relative;background:
    linear-gradient(180deg, rgba(6,6,45,0.12) 0%, rgba(6,6,45,0.7) 100%),
    url("file:///C:/Users/Shreyanshi%20Rathi/Desktop/Ghost%20research/Ghost%20Research/data/proposals/ai-energy-demand-2026/assets/P02-energy-analyst-monitors.jpg") center/cover no-repeat;
    padding:6.5%}
  .slidenum-tag{position:absolute;bottom:6.5%;left:6.5%;font-size:15px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.7)}
  .right{background:#06062D;padding:6.5%;display:flex;flex-direction:column;justify-content:space-between}
  .eyebrow{font-size:18px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:#EF4444;margin-bottom:16px}
  .h1{font-family:'Oranienbaum',serif;font-size:clamp(46px,6.4vh,62px);line-height:1.04;letter-spacing:-.01em;color:#FFFFFF;max-width:14ch;margin-bottom:20px}
  .pipeline{display:flex;flex-direction:column;gap:12px;font-size:18px;color:rgba(255,255,255,.9);font-weight:600;line-height:1.4}
  .pipeline .step{display:flex;align-items:center;gap:14px}
  .pipeline .num{font-family:'Oranienbaum',serif;color:#EF4444;font-size:28px;width:36px;line-height:1}
  .footer-cred{font-size:17px;font-weight:600;letter-spacing:.06em;color:rgba(255,255,255,.78);line-height:1.4}
</style></head>
<body>
  <div class="left">
    <div class="gh-logo"><div class="r1">GH<span class="sq"></span>ST</div><div class="r2">RESEARCH</div></div>
    <div class="slidenum-tag">1 / 3 · Swipe →</div>
  </div>
  <div class="right">
    <div>
      <div class="eyebrow">Methodology</div>
      <div class="h1">How we mapped $147B in capex.</div>
      <div class="pipeline">
        <div class="step"><div class="num">01</div><div>FERC regulatory filings</div></div>
        <div class="step"><div class="num">02</div><div>Hyperscaler 10-Q disclosures</div></div>
        <div class="step"><div class="num">03</div><div>Utility capex variance reports</div></div>
        <div class="step"><div class="num">04</div><div>10+ year SME expert panel</div></div>
        <div class="step"><div class="num">05</div><div>Published Atlas · June 1</div></div>
      </div>
    </div>
    <div class="footer-cred">1M+ curated sources · Caspr-powered · Full citation trail</div>
  </div>
</body></html>
