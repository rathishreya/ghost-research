<!doctype html>
<html><head><meta charset="utf-8"/>
<link href="https://fonts.googleapis.com/css2?family=Oranienbaum&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:100%;height:100vh;font-family:'Manrope',sans-serif;color:#F8F8FF;
    background:linear-gradient(135deg,#181650 0%,#06062D 100%);padding:8% 7%;overflow:hidden;
    display:flex;flex-direction:column;justify-content:center}
  .gh-logo{position:absolute;top:290px;left:60px;width:104px;height:104px}
  .gh-logo svg{width:100%;height:100%}
  .kick{font-size:34px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#EF4444;opacity:0;animation:fi .6s ease forwards .4s}
  .h1{font-family:'Oranienbaum',serif;font-size:96px;line-height:1.04;letter-spacing:-.01em;margin-top:24px;opacity:0;animation:fu 1s cubic-bezier(.2,.7,.2,1) forwards 1s}
  .h1 em{font-style:italic;color:#EF4444}
  .sheet{margin-top:46px;border:1px solid rgba(248,248,255,.18);border-radius:10px;overflow:hidden;opacity:0;animation:fu .8s ease forwards 2s}
  .r{display:flex;justify-content:space-between;padding:22px 26px;font-size:30px;border-bottom:1px solid rgba(248,248,255,.10)}
  .r.redact span:last-child{filter:blur(7px);color:rgba(248,248,255,.45)}
  .r.live{background:rgba(239,68,68,.10)}
  .r.live .fee{color:#EF4444;font-weight:800}
  .sub{font-size:30px;color:rgba(248,248,255,.8);margin-top:40px;max-width:26ch;opacity:0;animation:fu .8s ease forwards 9.5s}
  .cta{display:inline-flex;gap:10px;background:#EF4444;color:#fff;padding:20px 34px;border-radius:6px;font-weight:700;font-size:30px;margin-top:40px;width:fit-content;opacity:0;animation:fu .6s ease forwards 11s}
  @keyframes fi{to{opacity:1}}
  @keyframes fu{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  @keyframes count{0%{opacity:0}100%{opacity:1}}
  .fee{animation:count 1s ease forwards 6.5s;opacity:0}
</style></head>
<body>
  <div class="gh-logo" aria-label="Ghost Research"><svg viewBox="0 0 100 100"><rect width="100" height="100" rx="22" fill="#EF4444"/><circle cx="50" cy="50" r="19" fill="#fff"/></svg></div>
  <div class="kick">The line you're not pricing</div>
  <h1 class="h1">The <em>€3</em> per parcel<br>you're not pricing.</h1>
  <div class="sheet">
    <div class="r redact"><span>Product cost</span><span>██████</span></div>
    <div class="r redact"><span>Duty</span><span>██████</span></div>
    <div class="r live"><span>Per-parcel fee</span><span class="fee">+ €3.00 / parcel</span></div>
    <div class="r redact"><span>Net margin</span><span>██████</span></div>
  </div>
  <div class="sub">We modeled landed cost per SKU, per lane. Drops 7 June.</div>
  <span class="cta">Get the model when it drops →</span>
</body></html>
