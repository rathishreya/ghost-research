<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Oranienbaum&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1920px;font-family:Manrope,sans-serif;overflow:hidden;
  background-image:linear-gradient(180deg,rgba(6,6,45,0.42)0%,rgba(6,6,45,0.93)100%),url("file:///C:/Users/Shreyanshi%20Rathi/Desktop/Ghost%20research/Ghost%20Research/data/proposals/supply-chain-ai-forecast/assets/concept-01-w1d1-base-hero.jpg");
