<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700&family=Oranienbaum&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1080px; height: 1920px;
      background: #06062D;
      font-family: Manrope, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: 96px;
    }
    h1 {
      font-family: Oranienbaum, serif;
      font-size: 84px;
      line-height: 1.08;
      color: #F8F8FF;
      max-width: 920px;
      opacity: 0;
      animation: rise 1.2s ease-out 0.4s forwards;
    }
    .accent {
      color: #EF4444;
      display: block;
      margin-top: 28px;
      font-size: 52px;
      opacity: 0;
      animation: rise 1s ease-out 1.4s forwards;
    }
    .bar {
      margin-top: 56px;
      height: 6px;
      width: 0;
      background: #EF4444;
      animation: grow 0.9s ease-out 2.2s forwards;
    }
    @keyframes rise {
      from { transform: translateY(28px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes grow {
      from { width: 0; }
      to { width: 420px; }
    }
  </style>
  <script>
    window.addEventListener('load', () => {
      setTimeout(() => { window.__GHOST_DONE = true; }, 7500);
    });
  </script>
</head>
<body>
  <h1>Your ERP shows what happened last quarter.</h1>
  <span class="accent">Your board needs what happens next.</span>
  <div class="bar"></div>
</body>
</html>
