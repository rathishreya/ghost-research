<!doctype html><html><head><meta charset="utf-8"/>
<link href="https://fonts.googleapis.com/css2?family=Oranienbaum&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;font-family:Manrope,sans-serif;color:#F8F8FF;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(55% 40% at 50% 42%,rgba(24,22,80,.55) 0%,rgba(6,6,45,.92) 50%,#000 100%),#000;position:relative}
body::before{content:"";position:absolute;top:46%;left:50%;transform:translate(-50%,-50%);width:900px;height:220px;background:radial-gradient(closest-side,rgba(239,68,68,.20) 0%,rgba(239,68,68,0) 70%);filter:blur(60px);pointer-events:none;opacity:0;animation:bloom 1.4s ease 1.6s forwards}
body::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.02) 1px,transparent 1px);background-size:3px 3px;mix-blend-mode:screen;pointer-events:none}
.ad{width:100%;height:100%;padding:120px 92px 112px;display:flex;flex-direction:column;justify-content:space-between;position:relative;z-index:2;text-align:center}
.top{display:flex;flex-direction:column;align-items:center;gap:18px;opacity:0;transform:translateY(8px);animation:rise 1.0s cubic-bezier(.2,.7,.2,1) .2s forwards}
.wm{font-family:Oranienbaum,serif;font-size:30px;color:rgba(248,248,255,.96)}.wm i{color:#EF4444;font-style:normal}
.pretitle{font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:#EF4444;font-weight:800}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:32px}
.number{font-family:Oranienbaum,serif;font-size:380px;line-height:.84;letter-spacing:-.045em;color:#F8F8FF;text-shadow:0 0 80px rgba(239,68,68,.18);opacity:0;transform:translateY(20px);animation:rise 1.4s cubic-bezier(.2,.7,.2,1) 1.6s forwards}
.number .ru{color:#EF4444}
.ruleblock{display:flex;align-items:center;gap:14px;opacity:0;animation:fade .8s ease 3.2s forwards}
.rule{width:0;height:1.5px;background:#EF4444;animation:grow 1.0s ease 3.2s forwards}
.pin{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:#EF4444;font-weight:800}
.body{font-family:Oranienbaum,serif;font-size:48px;line-height:1.18;color:#F8F8FF;max-width:22ch;letter-spacing:-.005em;opacity:0;transform:translateY(14px);animation:rise 1.1s cubic-bezier(.2,.7,.2,1) 4.0s forwards}
.body em{color:rgba(248,248,255,.60);font-style:italic}
.bottom{display:flex;flex-direction:column;align-items:center;gap:18px;opacity:0;transform:translateY(10px);animation:rise .9s ease 5.4s forwards}
.cta{font-family:Manrope,sans-serif;font-weight:800;font-size:22px;color:#F8F8FF;letter-spacing:.04em}
.cta .price{color:#EF4444}.cta::after{content:"  →";color:#EF4444;font-weight:500;margin-left:4px}
.metab{font-size:12px;letter-spacing:.30em;text-transform:uppercase;color:rgba(248,248,255,.42);font-weight:600}
@keyframes rise{to{opacity:1;transform:translateY(0)}}
@keyframes fade{to{opacity:1}}
@keyframes grow{to{width:80px}}
@keyframes bloom{to{opacity:1}}
</style>
<script>window.addEventListener("load",()=>setTimeout(()=>window.__GHOST_DONE=true,8000));</script>
</head><body><div class="ad">
<div class="top"><div class="wm">Ghost Research<i>.</i></div><div class="pretitle">Now live · Caspr Self-Serve · $500</div></div>
<div class="center"><div class="number">$0.<span class="ru">93</span></div><div class="ruleblock"><span class="rule"></span><span class="pin">Average ROI per AI Dollar</span><span class="rule"></span></div><p class="body">Across 1,047 audited enterprise deployments. <em>Read the receipts.</em></p></div>
<div class="bottom"><div class="cta">Read the brief — <span class="price">$500</span></div><div class="metab">Self-serve · instant · 32 named SMEs</div></div>
</div></body></html>
