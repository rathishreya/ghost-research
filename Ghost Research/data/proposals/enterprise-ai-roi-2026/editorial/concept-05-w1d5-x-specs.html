<!doctype html><html><head><meta charset="utf-8"/>
<link href="https://fonts.googleapis.com/css2?family=Oranienbaum&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1080px;overflow:hidden;background:#F1F3FF;font-family:Manrope,system-ui,sans-serif;color:#06062D;-webkit-font-smoothing:antialiased}
body{background-image:radial-gradient(120% 60% at 80% 0%,rgba(24,22,80,.06) 0%,rgba(24,22,80,0) 60%),radial-gradient(120% 60% at 20% 100%,rgba(239,68,68,.04) 0%,rgba(239,68,68,0) 60%),#F1F3FF}
.ad{width:100%;height:100%;padding:72px 76px 64px;display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.wm{font-family:Oranienbaum,serif;font-size:28px;color:#06062D}.wm i{color:#EF4444;font-style:normal}
.meta{font-size:12px;letter-spacing:.26em;text-transform:uppercase;color:rgba(6,6,45,.55);font-weight:700;text-align:right;line-height:1.7}
.hero{margin-top:8px}
.pre{font-size:13px;letter-spacing:.26em;text-transform:uppercase;color:#EF4444;font-weight:800;margin-bottom:22px}
.h1{font-family:Oranienbaum,serif;font-size:108px;line-height:.95;letter-spacing:-.028em;color:#06062D;max-width:11ch}
.h1 em{font-style:italic;color:rgba(6,6,45,.55);display:block;font-size:62px;margin-top:6px}
.specs{margin-top:38px;max-width:680px;display:flex;flex-direction:column;border-top:1px solid rgba(6,6,45,.18)}
.row{display:flex;justify-content:space-between;align-items:baseline;padding:18px 0;border-bottom:1px solid rgba(6,6,45,.18)}
.row .k{font-family:Manrope,sans-serif;font-size:15px;font-weight:600;color:rgba(6,6,45,.55);letter-spacing:.02em}
.row .v{font-family:Oranienbaum,serif;font-size:28px;color:#06062D}
.row .v em{color:#EF4444;font-style:normal}
.bottom{display:flex;justify-content:space-between;align-items:flex-end;margin-top:14px}
.price{font-family:Oranienbaum,serif;font-size:30px;color:#06062D}.price b{color:#EF4444;font-weight:400}
.cta{font-family:Manrope,sans-serif;font-weight:800;font-size:15px;color:#06062D;letter-spacing:.02em;padding:15px 22px;background:#06062D;color:#F8F8FF;border-radius:4px}
.cta b{color:#EF4444;font-weight:800}
.cta::after{content:"  →";color:#EF4444;font-weight:600}
</style></head><body><div class="ad">
<div class="top"><div class="wm">Ghost Research<i>.</i></div><div class="meta">Caspr · Self-Serve<br/>Drops June 9, 2026</div></div>
<div class="hero">
<div class="pre">— 2026 Q3 Audit —</div>
<h1 class="h1">Enterprise AI.<em>Audited.</em></h1>
<div class="specs">
<div class="row"><span class="k">Deployments</span><span class="v"><em>1,047</em> &nbsp;production</span></div>
<div class="row"><span class="k">Reviewers</span><span class="v"><em>32</em> &nbsp;named SMEs</span></div>
<div class="row"><span class="k">Failure modes</span><span class="v">4 &nbsp;categorical</span></div>
<div class="row"><span class="k">Survived diligence</span><span class="v"><em>4</em></span></div>
</div>
</div>
<div class="bottom"><div class="price"><b>$500</b> &nbsp;institutional-grade.</div><div class="cta">Get on the list</div></div>
</div></body></html>
