<!doctype html><html><head><meta charset="utf-8"/>
<link href="https://fonts.googleapis.com/css2?family=Oranienbaum&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;font-family:Manrope,sans-serif;color:#F8F8FF;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(60% 45% at 50% 40%,rgba(24,22,80,.55) 0%,rgba(6,6,45,.85) 50%,#000 100%),#000;position:relative}
body::before{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:900px;height:200px;background:radial-gradient(closest-side,rgba(239,68,68,.22) 0%,rgba(239,68,68,0) 75%);filter:blur(60px);pointer-events:none}
.ad{width:100%;height:100%;padding:110px 88px 96px;display:flex;flex-direction:column;justify-content:space-between;position:relative;z-index:2;text-align:center}
.top{display:flex;flex-direction:column;align-items:center;gap:18px}
.wm{font-family:Oranienbaum,serif;font-size:32px;color:rgba(248,248,255,.96)}.wm i{color:#EF4444;font-style:normal}
.pretitle{font-size:13px;letter-spacing:.32em;text-transform:uppercase;color:#EF4444;font-weight:800}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:38px}
.hero{font-family:Oranienbaum,serif;font-size:170px;line-height:.94;letter-spacing:-.025em;color:#F8F8FF;max-width:9ch}
.hero em{color:#EF4444;font-style:italic;display:block;font-size:62px;margin-top:16px}
.rule{width:80px;height:1.5px;background:#EF4444}
.sub{font-size:24px;line-height:1.42;color:rgba(248,248,255,.62);max-width:30ch}
.bottom{display:flex;flex-direction:column;align-items:center;gap:22px}
.cta{font-family:Manrope,sans-serif;font-weight:800;font-size:24px;color:#F8F8FF;letter-spacing:.04em}
.cta .price{color:#EF4444}.cta::after{content:"  →";color:#EF4444;font-weight:500;margin-left:4px}
.metab{font-size:12px;letter-spacing:.30em;text-transform:uppercase;color:rgba(248,248,255,.42);font-weight:600}
</style></head><body><div class="ad">
<div class="top"><div class="wm">Ghost Research<i>.</i></div><div class="pretitle">Final 48 hours · $500</div></div>
<div class="center"><h1 class="hero">Last call.<em>The audit.</em></h1><div class="rule"></div><p class="sub">1,047 audited enterprise AI deployments. Self-serve. Instant.</p></div>
<div class="bottom"><div class="cta">Read the brief — <span class="price">$500</span></div><div class="metab">Closes Sunday midnight UTC</div></div>
</div></body></html>
