<!doctype html><html><head><meta charset="utf-8"/>
<link href="https://fonts.googleapis.com/css2?family=Oranienbaum&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1080px;overflow:hidden;font-family:Manrope,system-ui,sans-serif;color:#F8F8FF;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(80% 60% at 70% 35%,rgba(24,22,80,.65) 0%,rgba(6,6,45,.95) 55%,#000 100%),linear-gradient(180deg,#000 0%,#06062D 60%,#000 100%);background-color:#000;position:relative}
body::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.018) 1px,transparent 1px);background-size:3px 3px;mix-blend-mode:screen;pointer-events:none}
body::after{content:"";position:absolute;top:18%;right:-120px;width:320px;height:320px;background:radial-gradient(closest-side,rgba(239,68,68,.30) 0%,rgba(239,68,68,0) 70%);filter:blur(20px);pointer-events:none}
.ad{width:100%;height:100%;padding:88px 92px;display:flex;flex-direction:column;justify-content:space-between;position:relative;z-index:2}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.wm{font-family:Oranienbaum,serif;font-size:26px;letter-spacing:.01em;color:rgba(248,248,255,.96)}
.wm i{color:#EF4444;font-style:normal}
.meta{font-size:12px;letter-spacing:.26em;text-transform:uppercase;color:rgba(248,248,255,.48);font-weight:600;text-align:right;line-height:1.7}
.body{display:flex;flex-direction:column;justify-content:center;flex:1;margin-top:40px}
.hero{font-family:Oranienbaum,serif;font-size:132px;line-height:.98;letter-spacing:-.025em;color:#F8F8FF;max-width:12ch}
.hero em{color:#EF4444;font-style:italic}
.rule{width:56px;height:1.5px;background:#EF4444;margin-top:40px}
.sub{margin-top:28px;font-size:22px;line-height:1.55;color:rgba(248,248,255,.62);max-width:42ch;font-weight:400}
.bottom{display:flex;justify-content:space-between;align-items:flex-end}
.price{font-family:Oranienbaum,serif;font-size:18px;color:rgba(248,248,255,.72);letter-spacing:.04em}
.price b{color:#F8F8FF;font-weight:500}
.cta{font-family:Manrope,sans-serif;font-size:16px;font-weight:800;letter-spacing:.04em;color:#EF4444}
.cta::after{content:"  →";font-weight:500}
</style></head><body><div class="ad">
<div class="top"><div class="wm">Ghost Research<i>.</i></div><div class="meta">Caspr · 2026 Q3 Audit<br/>Drops June 9, 2026</div></div>
<div class="body"><h1 class="hero">1,000 GenAI deployments. <em>4 survived diligence.</em></h1><div class="rule"></div><p class="sub">The 2026 enterprise AI ROI audit. 1M+ curated sources. 32 named SMEs. Every claim cited.</p></div>
<div class="bottom"><div class="price"><b>Self-serve</b> · drops June 9.</div><div class="cta">Get on the list</div></div>
</div></body></html>
