<!doctype html><html><head><meta charset="utf-8"/>
<link href="https://fonts.googleapis.com/css2?family=Oranienbaum&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1080px;overflow:hidden;font-family:Manrope,sans-serif;color:#F8F8FF;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(80% 60% at 30% 35%,rgba(24,22,80,.65) 0%,rgba(6,6,45,.95) 55%,#000 100%),linear-gradient(180deg,#000 0%,#06062D 60%,#000 100%);background-color:#000;position:relative}
body::after{content:"";position:absolute;top:15%;left:-120px;width:320px;height:320px;background:radial-gradient(closest-side,rgba(239,68,68,.30) 0%,rgba(239,68,68,0) 70%);filter:blur(20px);pointer-events:none}
.ad{width:100%;height:100%;padding:88px 92px;display:flex;flex-direction:column;justify-content:space-between;position:relative;z-index:2}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.wm{font-family:Oranienbaum,serif;font-size:26px;color:rgba(248,248,255,.96)}.wm i{color:#EF4444;font-style:normal}
.meta{font-size:12px;letter-spacing:.26em;text-transform:uppercase;color:rgba(248,248,255,.48);font-weight:600;text-align:right;line-height:1.7}
.body{flex:1;display:flex;flex-direction:column;justify-content:center;margin-top:40px}
.pre{font-size:13px;letter-spacing:.32em;text-transform:uppercase;color:#EF4444;font-weight:800;margin-bottom:24px}
.hero{font-family:Oranienbaum,serif;font-size:160px;line-height:.96;letter-spacing:-.025em;color:#F8F8FF;max-width:11ch}
.hero em{color:#EF4444;font-style:italic;display:block;font-size:60px;margin-top:14px;letter-spacing:.01em}
.rule{width:56px;height:1.5px;background:#EF4444;margin-top:36px}
.sub{margin-top:24px;font-size:21px;line-height:1.55;color:rgba(248,248,255,.62);max-width:42ch}
.bottom{display:flex;justify-content:space-between;align-items:flex-end}
.price{font-family:Oranienbaum,serif;font-size:18px;color:rgba(248,248,255,.72)}
.price b{color:#F8F8FF;font-weight:500}
.cta{font-family:Manrope,sans-serif;font-size:16px;font-weight:800;color:#EF4444;letter-spacing:.04em}
.cta::after{content:"  →";font-weight:500}
</style></head><body><div class="ad">
<div class="top"><div class="wm">Ghost Research<i>.</i></div><div class="meta">Caspr · 2026 Q3 Audit<br/>Monday, June 9</div></div>
<div class="body">
<div class="pre">— 48 Hours —</div>
<h1 class="hero">Publishes <em>Monday.</em></h1>
<div class="rule"></div>
<p class="sub">1,047 enterprise GenAI deployments. 6 unit-economics patterns. 4 categorical failures.</p>
</div>
<div class="bottom"><div class="price"><b>Self-serve</b> · institutional-grade.</div><div class="cta">Get on the list</div></div>
</div></body></html>
