html,body{width:1080px;height:1920px;overflow:hidden;font-family:Manrope,sans-serif;color:#F8F8FF;-webkit-font-smoothing:antialiased}
body{position:relative;background:#000;background-image:linear-gradient(180deg,rgba(0,0,0,.20) 0%,rgba(0,0,0,.48) 38%,rgba(0,0,0,.78) 65%,rgba(0,0,0,.96) 90%),url("file:///C:/Users/Shreyanshi%20Rathi/Desktop/Ghost%20research/Ghost%20Research/data/proposals/cfo-defense-pack-q2-2026/assets/P2-window-executive.jpg");background-size:cover;background-position:center}

.top{opacity:0;transform:translateY(8px);animation:rise 1.0s cubic-bezier(.2,.7,.2,1) .2s forwards;display:flex;justify-content:space-between;align-items:flex-start}
.wm{font-family:Oranienbaum,serif;font-size:30px;color:rgba(248,248,255,.96)}.wm i{color:#EF4444;font-style:normal}
.meta{font-size:12px;letter-spacing:.30em;text-transform:uppercase;color:#EF4444;font-weight:800;text-align:right;line-height:1.7;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.body{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:0}
.pre{font-size:14px;letter-spacing:.30em;text-transform:uppercase;color:#EF4444;font-weight:800;margin-bottom:18px;opacity:0;animation:rise .9s ease 1.4s forwards;transform:translateY(8px)}
.hero{font-family:Oranienbaum,serif;font-size:152px;line-height:.94;letter-spacing:-.025em;color:#F8F8FF;text-shadow:0 4px 28px rgba(0,0,0,.7);opacity:0;transform:translateY(18px);animation:rise 1.3s cubic-bezier(.2,.7,.2,1) 2.0s forwards}
.hero .ru{color:#EF4444}
.rule{width:0;height:1.5px;background:#EF4444;margin-top:28px;animation:grow 1.0s ease 3.6s forwards}
.sub{margin-top:22px;font-size:24px;line-height:1.42;color:rgba(248,248,255,.82);max-width:32ch;text-shadow:0 2px 16px rgba(0,0,0,.6);opacity:0;transform:translateY(12px);animation:rise 1.0s ease 4.0s forwards}
.sub em{color:rgba(248,248,255,.55);font-style:italic}
.bottom{display:flex;justify-content:space-between;align-items:flex-end;margin-top:36px;opacity:0;transform:translateY(10px);animation:rise .9s ease 5.4s forwards}
.cta{font-family:Manrope,sans-serif;font-size:20px;font-weight:800;color:#fff;background:#EF4444;padding:18px 28px;border-radius:4px;box-shadow:0 10px 32px rgba(239,68,68,.40)}
.cta b{color:#fff}.cta::after{content:"  →"}
.metab{font-size:11px;letter-spacing:.30em;text-transform:uppercase;color:rgba(248,248,255,.62);font-weight:700}
@keyframes rise{to{opacity:1;transform:translateY(0)}}
@keyframes grow{to{width:80px}}
</style>
<script>window.addEventListener("load",()=>setTimeout(()=>window.__GHOST_DONE=true,8000));</script>
</head><body><div class="ad">
